<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halı Görselleştirme Uygulaması</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Halı Görselleştirme</h1>
            <p class="subtitle">Oda görüntüsü yükleyin, köşe noktalarını sürükleyerek perspektif ayarlayın</p>
        </div>

        <div class="upload-section">
            <div class="upload-group">
                <label class="upload-label">
                    <span class="upload-icon">🏠</span>
                    <span class="upload-text">Oda Görüntüsü Yükle</span>
                    <input type="file" id="roomImageInput" accept="image/*" class="file-input">
                </label>
                <div id="roomImageName" class="file-name"></div>
            </div>

            <div class="upload-group">
                <label class="upload-label">
                    <span class="upload-icon">🧶</span>
                    <span class="upload-text">Halı Görüntüsü Yükle</span>
                    <input type="file" id="carpetImageInput" accept="image/*" class="file-input">
                </label>
                <div id="carpetImageName" class="file-name"></div>
            </div>
        </div>

        <div class="canvas-container">
            <div class="canvas-wrapper">
                <canvas id="mainCanvas" willReadFrequently="true"></canvas>
                <div id="instructions" class="instructions">
                    <p>👆 Başlamak için oda görüntüsü yükleyin</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button id="applyCarpetBtn" class="btn btn-success" disabled>
                    <span>✨</span> Halıyı Uygula
                </button>
                <button id="resetBtn" class="btn btn-secondary">
                    <span>🔄</span> Sıfırla
                </button>
            </div>
        </div>

        <div class="status-bar">
            <div id="statusText">Hazır</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
